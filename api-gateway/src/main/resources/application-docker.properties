server.port=8080

eureka.client.serviceUrl.defaultZone=http://eureka:password@discovery-server:8761/eureka

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://keycloak:8080/realms/spring-boot-microservices-realm

spring.cloud.gateway.server.webmvc.routes[2].uri=http://discovery-server:8761
spring.cloud.gateway.server.webmvc.routes[3].uri=http://discovery-server:8761

management.tracing.sampling.probability=1.0
management.tracing.export.zipkin.endpoint=http://zipkin:9411/api/v2/spans
